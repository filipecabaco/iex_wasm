[package]
name = "jtab"
version = "0.1.0"
edition = "2024"
description = "Render JSON arrays of objects as tables"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
comfy-table = "=8.0.0"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
strip = true
