name: Benchmark report

# After each run of "CI and Pages", whose site jobs benchmark every site (bench/run.mjs): main's
# results become the baseline; a pull request's, or a run by hand on another armless, are
# compared with the latest baseline, in the run's summary and a comment on the pull request.
# It reports only: the numbers never fail anything.
#
# A workflow_run workflow runs main's version of this file with a token that can comment, also
# for pull requests from forks; it only reads their results (JSON), never runs their code.
on:
  workflow_run:
    workflows: ["CI and Pages"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      EVENT: ${{ github.event.workflow_run.event }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the results
        id: results
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'bench-*' --dir results || true
          if ls results/*/*.json > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No benchmark results in run $RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          fi

      # main's own pushes: the baseline later runs compare with
      - name: Publish the baseline
        if: steps.results.outputs.found && env.EVENT == 'push' && env.BRANCH == 'main'
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node bench/report.mjs results --combine baseline.json
          node bench/report.mjs results --sha "$HEAD_SHA" --run-url "$RUN_URL" --out report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: steps.results.outputs.found && env.EVENT == 'push' && env.BRANCH == 'main'
        with:
          name: bench-baseline
          path: baseline.json
          retention-days: 90

      - name: Compare with main
        if: steps.results.outputs.found && !(env.EVENT == 'push' && env.BRANCH == 'main')
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bench-baseline&per_page=50" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].id // empty')
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > baseline.zip
            unzip -o -q baseline.zip -d baseline
          fi
          node bench/report.mjs results ${id:+--baseline baseline/baseline.json} --sha "$HEAD_SHA" --run-url "$RUN_URL" --out report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, updated by each run
      - name: Comment on the pull request
        if: steps.results.outputs.found && env.EVENT == 'pull_request'
        env:
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          # Pull requests from forks aren't listed on the run: find it by its head commit
          pr=${PR:-$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty' || true)}
          if [ -z "$pr" ]; then
            echo "No open pull request for $HEAD_SHA"
            exit 0
          fi
          marker='<!-- snowglobe-bench -->'
          comment=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F body=@report.md > /dev/null && ok=1
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -F body=@report.md > /dev/null && ok=1
          fi
          # A token that can't comment (a repository that limits workflow tokens to reading): the
          # report stays in this run's summary
          if [ -n "${ok:-}" ]; then
            echo "Commented on #$pr"
          else
            echo "::warning title=Benchmark::couldn't comment on #$pr; the report is in this run's summary"
            printf '\n> Not posted on #%s: this token cannot comment.\n' "$pr" >> "$GITHUB_STEP_SUMMARY"
          fi
