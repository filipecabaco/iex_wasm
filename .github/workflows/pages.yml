name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Installs Go from mise.toml (cached between runs)
      - uses: jdx/mise-action@v5

      - name: Test
        run: mise run test

      # Anonymous Docker Hub pulls from shared runners hit its rate limit (429); pull through
      # Google's public mirror instead
      - name: Use a Docker Hub mirror
        run: |
          config=/etc/docker/daemon.json
          [ -s "$config" ] || echo '{}' | sudo tee "$config" > /dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' "$config" | sudo tee "$config.new" > /dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}'

      # The i386 guest image builds natively on amd64 runners, no emulation needed
      - name: Build site
        run: mise run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
