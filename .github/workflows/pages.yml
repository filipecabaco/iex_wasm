name: CI and Pages

# Every push to main and every pull request: the tests, then every site built and checked (the
# demos on the site, plus the examples in EXAMPLES that aren't). Pushes to main then assemble the
# demos into the site and deploy it to GitHub Pages. release.yml calls it with release: true to
# gate a release on the same checks, without touching the site. Every site is also benchmarked
# (bench/); the bench-report job reports them and keeps each run on refs/snowglobe/bench.
#
# Run by hand with armless_ref, the sites are built and benchmarked on that armless (a branch,
# tag or full commit) instead of the pinned release, and nothing is deployed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      armless_ref:
        description: "Build and benchmark the sites on this armless (branch, tag or full commit); deploys nothing"
        required: false
        default: ""
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  # contents: write pushes the blob store (refs/snowglobe/blobs) from main's runs, and the
  # benchmark results (refs/snowglobe/bench); pull-requests: write comments the benchmark report
  contents: write
  pull-requests: write
  pages: write
  id-token: write

# A newer push to a pull request replaces its run; main's runs (and deploys) queue. A release's
# checks (release.yml, release: true) queue on their own: a change to VERSION on main starts both
# this workflow and release.yml for the same ref, and a group keeps only one run waiting, so
# sharing it would cancel main's run (and its deploy)
concurrency:
  group: ci-${{ github.ref }}${{ inputs.release && '-release' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # DEMOS (on the site) and EXAMPLES (CI only) in mise.toml are the lists of sites. A site named
  # <example>-<n>cpu is examples/<example> built with --cpus <n> (an X card needs one CPU)
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sites: ${{ steps.sites.outputs.sites }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install: false

      - id: sites
        run: |
          echo "sites=$(mise env --json | jq -c '[(.DEMOS | split(" ") | .[] | {name: ., deploy: true}),
                                                 (.EXAMPLES | split(" ") | .[] | {name: ., deploy: false})]
                                                | map(. + {src: (.name | sub("-[0-9]+cpu$"; "")),
                                                           cpus: (.name | capture("-(?<n>[0-9]+)cpu$").n // "")})')" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs Go from mise.toml (cached between runs)
      - uses: jdx/mise-action@v5

      - name: Test
        run: mise run test

  # The tools image (snowglobe-vm, compiled from Rust, and the page runtime) is built once and
  # loaded by every site job; it's cached until its sources change
  tools:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      # Before the cache key: the edited image is a different image
      - name: Use armless ${{ inputs.armless_ref }}
        if: inputs.armless_ref
        env:
          ARMLESS_REF: ${{ inputs.armless_ref }}
        run: |
          sh bench/use-armless.sh "$ARMLESS_REF"
          git diff --binary > armless-ref.patch

      - uses: actions/upload-artifact@v7
        if: inputs.armless_ref
        with:
          name: armless-ref-patch
          path: armless-ref.patch
          retention-days: 1

      - uses: actions/cache@v6
        id: cache
        with:
          path: tools.tar.zst
          key: snowglobe-tools-${{ hashFiles('internal/tools/Dockerfile', 'internal/tools/runtime/**') }}

      - name: Build the tools image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          go build -o snowglobe ./cmd/snowglobe
          docker save "$(./snowglobe tools)" | zstd -T0 -3 -o tools.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: tools-image
          path: tools.tar.zst
          retention-days: 1

  # Each site is built (or restored: a site is cached until its example or snowglobe changes),
  # then run headlessly and checked. Guests are arm64: arm64 runners build them natively.
  site:
    needs: [setup, tools]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.setup.outputs.sites) }}
    name: ${{ matrix.site.name }}
    env:
      SITE: ${{ matrix.site.name }}
      SRC: ${{ matrix.site.src }}
      CPUS: ${{ matrix.site.cpus }}
    steps:
      - uses: actions/checkout@v7

      # Installs Go from mise.toml (cached between runs)
      - uses: jdx/mise-action@v5

      # The same edit as the tools job's, so this snowglobe finds the image it built (and the
      # site's cache key changes with it)
      - uses: actions/download-artifact@v8
        if: inputs.armless_ref
        with:
          name: armless-ref-patch
      - name: Use armless ${{ inputs.armless_ref }}
        if: inputs.armless_ref
        run: git apply armless-ref.patch && rm armless-ref.patch

      - uses: actions/cache@v6
        id: cache
        with:
          path: dist/${{ matrix.site.name }}
          key: site-${{ matrix.site.name }}-${{ hashFiles(format('examples/{0}/**', matrix.site.src), 'internal/**', 'cmd/**', 'go.mod', 'go.sum') }}

      - uses: actions/download-artifact@v8
        with:
          name: tools-image

      - name: Load the tools image
        run: |
          zstd -dc tools.tar.zst | docker load && rm tools.tar.zst
          go build -o snowglobe ./cmd/snowglobe

      # Anonymous Docker Hub pulls from shared runners hit its rate limit (429); pull through
      # Google's public mirror instead
      - name: Use a Docker Hub mirror
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          config=/etc/docker/daemon.json
          [ -s "$config" ] || echo '{}' | sudo tee "$config" > /dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' "$config" | sudo tee "$config.new" > /dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker

      - name: Build ${{ matrix.site.name }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./snowglobe build "examples/$SRC" --out "dist/$SITE" ${CPUS:+--cpus "$CPUS"}

      # Type into the app in its own language and check what it prints. The Go demo is a
      # full-screen app with no prompt: it only has to keep running.
      - name: Check ${{ matrix.site.name }}
        if: matrix.site.name != 'curl'
        run: |
          case "$SRC" in
            iex|elixir) commands='IO.puts("snowglobe-#{6 * 7}")'; expect=snowglobe-42 ;;
            python)     commands='print(f"snowglobe-{6 * 7}")'; expect=snowglobe-42 ;;
            typescript) commands='console.log("snowglobe-" + 6 * 7)'; expect=snowglobe-42 ;;
            java)       commands='System.out.println("snowglobe-" + 6 * 7)'; expect=snowglobe-42 ;;
            postgres)   commands="SELECT 'snowglobe-' || 6 * 7;"; expect=snowglobe-42 ;;
            rust)       commands='echo snowglobe-$((6 * 7))'; expect=snowglobe-42 ;;
            # Packages installed into the running machine, from Alpine's mirrors
            apk)        commands=$'apk add figlet >/dev/null 2>&1; echo "apk exit=$?"\nfiglet -w 60 armless'
                        expect=$'apk exit=0\n__ _ _ __ _ __ ___' ;;
            # The Supabase CLI's native stack and the notes app on it: Grace can't see Ada's note. The
            # first line waits for Auth and the Data API to answer: just restored from the snapshot, on one
            # CPU, they can take longer than the gateway allows for a first request
            supabase)   commands=$'for i in $(seq 30); do curl -fsS -o /dev/null -m 10 "$API_URL/auth/v1/health" && curl -fsS -o /dev/null -m 10 -H "apikey: $ANON_KEY" "$API_URL/rest/v1/" && break; sleep 2; done\nnotes signup ada@example.com lovelace-1815\nnotes add first program, for the analytical engine\nnotes ls\nnotes signup grace@example.com hopper-1906\nnotes ls'
                        expect=$'#1 added\nada@example.com: 1 note(s)\ngrace@example.com: 0 note(s)' ;;
            go)         commands= ;;
            *)          echo "::error title=$SITE::no check for $SITE"; exit 1 ;;
          esac
          if [ -z "$commands" ]; then
            ./snowglobe run "dist/$SITE" --name check --detach
            sleep 20
            ./snowglobe ps | grep -q check || { echo "::error title=$SITE::the instance stopped"; exit 1; }
            ./snowglobe stop check
            exit 0
          fi
          printf '%s\n' "$commands" | ./snowglobe run "dist/$SITE" | tee out.txt
          printf '%s\n' "$expect" | while IFS= read -r line; do
            grep -qF -- "$line" out.txt || { echo "::error title=$SITE::expected a line with: $line"; exit 1; }
          done

      # curl gets the whole headless workflow: piped and detached runs, exec, HTTP(S) out of
      # the guest, -p port forwarding and attach
      - name: Check curl end to end
        if: matrix.site.name == 'curl'
        run: |
          out=$(printf 'uname -m\n' | ./snowglobe run dist/curl)
          [ "$out" = aarch64 ] || { echo "::error title=piped::got $out"; exit 1; }
          ./snowglobe run dist/curl --name smoke --detach -p 18000:8000
          trap './snowglobe stop smoke || true' EXIT
          [ "$(./snowglobe exec smoke nproc)" = 1 ]
          ./snowglobe exec smoke 'curl -sS -m 30 -o /dev/null -w "%{http_code}" https://api.github.com/zen; echo " exit=$?"' | tee https.txt
          grep -q '^200 exit=0$' https.txt || { echo "::error title=https::$(cat https.txt)"; exit 1; }
          ./snowglobe exec smoke 'curl -sS -m 30 -o /dev/null -w "%{http_code}" http://example.com/; echo " exit=$?"' | tee http.txt
          grep -q '^200 exit=0$' http.txt || { echo "::error title=http::$(cat http.txt)"; exit 1; }
          ./snowglobe exec smoke '(while true; do printf "HTTP/1.0 200 OK\r\n\r\nhello from the guest\n" | nc -l -p 8000; done) >/dev/null 2>&1 &'
          for i in 1 2 3 4 5; do
            body=$(curl -sS -m 20 http://127.0.0.1:18000/ || true)
            [ "$body" = "hello from the guest" ] && break
            sleep 2
          done
          [ "$body" = "hello from the guest" ] || { echo "::error title=port forwarding::got $body"; exit 1; }
          out=$( (sleep 2; printf 'echo attached-$((40+2))\n'; sleep 3; printf '\035') | ./snowglobe attach smoke)
          echo "$out" | grep -q attached-42 || { echo "::error title=attach::$out"; exit 1; }
          ./snowglobe ps | grep -q smoke

      # Cold, warm and 4G visits in Chromium and the exercise commands timed (bench/run.mjs), on
      # a copy made an installable app as the live demos are. Fails only if the harness does;
      # bench-report turns every site's numbers into one report
      - uses: actions/setup-node@v7
        if: ${{ !inputs.release }}
        with:
          node-version: 22

      - name: Install the benchmark's browser
        if: ${{ !inputs.release }}
        run: |
          cd bench && npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Benchmark ${{ matrix.site.name }}
        if: ${{ !inputs.release }}
        env:
          ARMLESS_REF: ${{ inputs.armless_ref }}
        run: |
          # Hard links, but not for what `snowglobe pwa` rewrites in place
          copy="$RUNNER_TEMP/bench/$SITE"
          mkdir -p "$(dirname "$copy")"
          cp -al "dist/$SITE" "$copy"
          for f in index.html sw.js; do
            if [ -e "$copy/$f" ]; then rm "$copy/$f"; cp "dist/$SITE/$f" "$copy/$f"; fi
          done
          ./snowglobe pwa "$copy"
          node bench/run.mjs "$copy" --out-dir bench-results --reps 3 --throttled-reps 2
          cat bench-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.release && !cancelled() }}
        with:
          name: bench-${{ matrix.site.name }}
          path: bench-results/${{ matrix.site.name }}.json
          if-no-files-found: ignore
          retention-days: 14

      # Hidden files must come along: `snowglobe pool` looks for each build's .snowglobe marker
      - uses: actions/upload-artifact@v7
        if: matrix.site.deploy && github.event_name != 'pull_request' && !inputs.release && !inputs.armless_ref
        with:
          name: site-${{ matrix.site.name }}
          path: dist/${{ matrix.site.name }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The benchmark report of this run's site jobs, in its summary and, on a pull request, in one
  # comment that each run updates. Every run is also kept as a file on refs/snowglobe/bench
  # (pr/<number>/<commit>.json; main/<commit>.json and main/latest.json), outside refs/heads like
  # the blob store, so the comment lists the pull request's earlier runs and, once main has run,
  # compares with main's latest. It reports only: the numbers never fail CI
  bench-report:
    needs: site
    if: ${{ !cancelled() && !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ARMLESS_REF: ${{ inputs.armless_ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: results

      - name: Report
        id: report
        run: |
          if ! ls results/*/*.json > /dev/null 2>&1; then
            echo "No benchmark results in this run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          GITHUB_SHA="$HEAD_SHA" node bench/report.mjs results --combine run.json
          # Earlier runs, if the ref exists yet: this pull request's, and main's latest
          args=()
          if git fetch --quiet --depth=1 origin +refs/snowglobe/bench:refs/snowglobe/bench 2>/dev/null; then
            if [ -n "$PR" ] && git cat-file -e "refs/snowglobe/bench:pr/$PR" 2>/dev/null; then
              mkdir -p history
              git archive refs/snowglobe/bench "pr/$PR" | tar -x -C history
              args+=(--history "history/pr/$PR")
            fi
            if git show refs/snowglobe/bench:main/latest.json > main-latest.json 2>/dev/null; then
              args+=(--baseline main-latest.json)
            fi
          fi
          node bench/report.mjs results "${args[@]}" --sha "$HEAD_SHA" --run-url "$RUN_URL" \
            ${ARMLESS_REF:+--armless-ref "$ARMLESS_REF"} --out report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # A commit on refs/snowglobe/bench adding this run's file, retried if another run's push
      # got there first. A pull request from a fork has a read-only token: its run isn't kept
      - name: Keep the results
        if: steps.report.outputs.found && !inputs.armless_ref && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        continue-on-error: true
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_INDEX_FILE: ${{ runner.temp }}/bench-index
        run: |
          blob=$(git hash-object -w run.json)
          for attempt in 1 2 3; do
            rm -f "$GIT_INDEX_FILE"
            parent=()
            if git fetch --quiet --depth=1 origin +refs/snowglobe/bench:refs/snowglobe/bench 2>/dev/null; then
              git read-tree refs/snowglobe/bench
              parent=(-p refs/snowglobe/bench)
            fi
            if [ -n "$PR" ]; then
              git update-index --add --cacheinfo "100644,$blob,pr/$PR/$HEAD_SHA.json"
              message="Benchmark of $HEAD_SHA (#$PR)"
            else
              git update-index --add --cacheinfo "100644,$blob,main/$HEAD_SHA.json"
              git update-index --add --cacheinfo "100644,$blob,main/latest.json"
              message="Benchmark of $HEAD_SHA (main)"
            fi
            commit=$(git commit-tree "$(git write-tree)" "${parent[@]}" -m "$message")
            if git push --quiet origin "$commit:refs/snowglobe/bench"; then
              echo "Kept as $(git show --name-only --format= "$commit" | head -n1) on refs/snowglobe/bench"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::warning title=Benchmark::couldn't keep this run's results on refs/snowglobe/bench"

      # One comment per pull request, updated by each run. A token that can't comment (a fork's):
      # the report stays in this run's summary
      - name: Comment on the pull request
        if: steps.report.outputs.found && github.event_name == 'pull_request'
        run: |
          marker='<!-- snowglobe-bench -->'
          comment=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1 || true)
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F body=@report.md > /dev/null && ok=1
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@report.md > /dev/null && ok=1
          fi
          if [ -n "${ok:-}" ]; then
            echo "Commented on #$PR"
          else
            echo "::warning title=Benchmark::couldn't comment on #$PR; the report is in this run's summary"
          fi

  assemble:
    needs: [test, site]
    if: github.event_name != 'pull_request' && !inputs.release && !inputs.armless_ref
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs Go from mise.toml (cached between runs)
      - uses: jdx/mise-action@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: dist

      # The demos share one blob store (`snowglobe pool`). It goes to git instead of Pages (whose
      # sites are capped at 1 GB): a commit on refs/snowglobe/blobs, outside refs/heads so clones
      # don't fetch it, chained on the last one so only new blobs are pushed and older pages
      # (installed apps, cached copies) keep finding theirs. raw.githubusercontent.com serves it
      # at that commit, with CORS. The rest of each site (pages, snapshots, warm packs) is Pages'.
      - name: Assemble site, and publish the blob store
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          for d in dist/site-*; do mv "$d" "dist/${d#dist/site-}"; done
          go build -o snowglobe ./cmd/snowglobe
          ./snowglobe pool dist

          export GIT_INDEX_FILE="$RUNNER_TEMP/blobs.index"
          git -C dist/blobs --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=. add -A .
          tree=$(git write-tree)
          parent=
          if git fetch --quiet --depth=1 origin +refs/snowglobe/blobs:refs/snowglobe/blobs; then
            parent="-p $(git rev-parse refs/snowglobe/blobs)"
          fi
          commit=$(git commit-tree "$tree" $parent -m "Blobs for $GITHUB_SHA")
          git push --quiet origin "$commit:refs/snowglobe/blobs"
          unset GIT_INDEX_FILE
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$commit/"
          echo "blob store: $url ($(du -sh dist/blobs | cut -f1))"
          for page in dist/*/index.html; do
            sed -i "s#baseurl: \"../blobs/\"#baseurl: \"$url\"#" "$page"
            grep -q "baseurl: \"$url\"" "$page" || { echo "::error::$page doesn't point at the blob store"; exit 1; }
          done
          rm -rf dist/blobs

          # The rest of `mise run assemble`: every demo an installable app, and the index page
          for demo in $DEMOS; do ./snowglobe pwa "dist/$demo"; done
          cp -R site/. dist/
          cp -R dist/elixir/xterm dist/xterm
          du -sh dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: assemble
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
