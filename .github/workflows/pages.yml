name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Each demo takes minutes to build (docker builds, then booting the guest to snapshot it), so they
# build side by side, one job each, and `assemble` gathers them into the site. Locally, `mise run
# build` does the same steps one after another.
jobs:
  # DEMOS in mise.toml is the one list of demos; this hands it to the matrix below
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      demos: ${{ steps.demos.outputs.demos }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install: false

      - id: demos
        run: echo "demos=$(mise env --json | jq -c '.DEMOS | split(" ")')" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs Go from mise.toml (cached between runs)
      - uses: jdx/mise-action@v5

      - name: Test
        run: mise run test

  # The tools image (snowglobe-vm, compiled from Rust, and the page runtime) is built once and
  # loaded by every demo job, instead of compiled nine times; it's cached until its sources change
  tools:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        id: cache
        with:
          path: tools.tar.zst
          key: snowglobe-tools-${{ hashFiles('internal/tools/Dockerfile', 'internal/tools/runtime/**') }}

      - name: Build the tools image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          go build -o snowglobe ./cmd/snowglobe
          docker save "$(./snowglobe tools)" | zstd -T0 -3 -o tools.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: tools-image
          path: tools.tar.zst
          retention-days: 1

  demo:
    needs: [setup, tools]
    # Guests are arm64: arm64 runners build their images natively, no emulation needed
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        demo: ${{ fromJSON(needs.setup.outputs.demos) }}
    steps:
      - uses: actions/checkout@v7

      # Installs Go from mise.toml (cached between runs)
      - uses: jdx/mise-action@v5

      # Anonymous Docker Hub pulls from shared runners hit its rate limit (429); pull through
      # Google's public mirror instead
      - name: Use a Docker Hub mirror
        run: |
          config=/etc/docker/daemon.json
          [ -s "$config" ] || echo '{}' | sudo tee "$config" > /dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' "$config" | sudo tee "$config.new" > /dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}'

      - uses: actions/download-artifact@v8
        with:
          name: tools-image

      - name: Build ${{ matrix.demo }}
        env:
          DEMO: ${{ matrix.demo }}
        run: |
          zstd -dc tools.tar.zst | docker load && rm tools.tar.zst
          go build -o snowglobe ./cmd/snowglobe
          ./snowglobe build "examples/$DEMO" --out "dist/$DEMO"

      # The headless runtime, on the site just built: type into the app in its own language and
      # check what it prints (the Go demo is a full-screen app with no prompt: it only has to run)
      - name: Run ${{ matrix.demo }} headlessly
        env:
          DEMO: ${{ matrix.demo }}
        run: |
          ./snowglobe run "dist/$DEMO" --name smoke --detach
          case "$DEMO" in
            iex|elixir) check='IO.puts("snowglobe-#{6 * 7}")' ;;
            python)     check='print(f"snowglobe-{6 * 7}")' ;;
            typescript) check='console.log("snowglobe-" + 6 * 7)' ;;
            java)       check='System.out.println("snowglobe-" + 6 * 7)' ;;
            postgres)   check="SELECT 'snowglobe-' || 6 * 7;" ;;
            go)         check= ;;
            *)          check='echo snowglobe-$((6 * 7))' ;;
          esac
          if [ -n "$check" ]; then
            out=$(./snowglobe exec smoke "$check" || true)
            echo "$out"
            echo "$out" | grep -q snowglobe-42 || { echo "::error title=$DEMO::expected snowglobe-42"; ./snowglobe stop smoke; exit 1; }
          else
            sleep 20
            ./snowglobe ps | grep -q smoke || { echo "::error title=$DEMO::the instance stopped"; exit 1; }
          fi
          ./snowglobe stop smoke

      # Hidden files must come along: `snowglobe pool` looks for each build's .snowglobe marker
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.demo }}
          path: dist/${{ matrix.demo }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: [test, demo]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs Go from mise.toml (cached between runs)
      - uses: jdx/mise-action@v5

      # The demo artifacts are the only ones in the run at this point; each lands in dist/<demo>
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Assemble site
        run: |
          rm -rf dist/tools-image
          mise run assemble
          du -sh dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: assemble
    # main-demo is skipped on main, and a skip upstream would skip this too
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
