name: Smoke test

# One small site, built and driven end to end the way people use it: snowglobe build, then
# snowglobe run (piped and detached), exec, attach, -p port forwarding, and HTTP(S) out of the
# guest. arm64 runners build the arm64 guest natively.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tools image (snowglobe-vm, compiled from Rust, and the page runtime) is built once and
  # loaded by the jobs below, instead of compiled in each; it's cached until its sources change
  tools:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        id: cache
        with:
          path: tools.tar.zst
          key: snowglobe-tools-${{ hashFiles('internal/tools/Dockerfile', 'internal/tools/runtime/**') }}

      - name: Build the tools image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          go build -o snowglobe ./cmd/snowglobe
          docker save "$(./snowglobe tools)" | zstd -T0 -3 -o tools.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: tools-image
          path: tools.tar.zst
          retention-days: 1

  smoke:
    needs: tools
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Installs Go from mise.toml (cached between runs)
      - uses: jdx/mise-action@v5

      - name: Use a Docker Hub mirror
        run: |
          config=/etc/docker/daemon.json
          [ -s "$config" ] || echo '{}' | sudo tee "$config" > /dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' "$config" | sudo tee "$config.new" > /dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker

      - uses: actions/download-artifact@v8
        with:
          name: tools-image

      - name: Build the curl example
        run: |
          zstd -dc tools.tar.zst | docker load && rm tools.tar.zst
          go build -o snowglobe ./cmd/snowglobe
          ./snowglobe build examples/curl --out dist/curl

      - name: Run it piped
        run: |
          out=$(printf 'uname -m\n' | ./snowglobe run dist/curl)
          echo "$out"
          [ "$out" = aarch64 ]

      - name: Detached, exec, HTTP(S) out of the guest
        run: |
          ./snowglobe run dist/curl --name smoke --detach -p 18000:8000
          ./snowglobe exec smoke 'nproc' | tee nproc.txt
          [ "$(cat nproc.txt)" = 1 ]
          ./snowglobe exec smoke 'curl -sS -m 30 -o /dev/null -w "%{http_code}" https://api.github.com/zen; echo " exit=$?"' | tee https.txt
          grep -q '^200 exit=0$' https.txt
          ./snowglobe exec smoke 'curl -sS -m 30 -o /dev/null -w "%{http_code}" http://example.com/; echo " exit=$?"' | tee http.txt
          grep -q '^200 exit=0$' http.txt

      - name: Port forwarding into the guest
        run: |
          ./snowglobe exec smoke '(while true; do printf "HTTP/1.0 200 OK\r\n\r\nhello from the guest\n" | nc -l -p 8000; done) >/dev/null 2>&1 &'
          for i in 1 2 3 4 5; do
            body=$(curl -sS -m 20 http://127.0.0.1:18000/ || true)
            [ "$body" = "hello from the guest" ] && break
            sleep 2
          done
          echo "$body"
          [ "$body" = "hello from the guest" ]

      - name: Attach and detach
        run: |
          out=$( (sleep 2; printf 'echo attached-$((40+2))\n'; sleep 3; printf '\035') | ./snowglobe attach smoke)
          echo "$out"
          echo "$out" | grep -q attached-42
          ./snowglobe ps | grep -q smoke

      - name: Clean up
        if: always()
        run: ./snowglobe stop smoke || true

  # The examples that aren't on the demo site (DEMOS) are built and driven here instead
  examples:
    needs: tools
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Packages installed into the running machine, from Alpine's mirrors
          - example: apk
            commands: |
              apk add figlet >/dev/null 2>&1; echo "apk exit=$?"
              figlet -w 60 armless
            expect: |
              apk exit=0
              __ _ _ __ _ __ ___
          # The Supabase CLI's native stack, and the notes app on it: Grace can't see Ada's note
          - example: supabase
            commands: |
              notes signup ada@example.com lovelace-1815
              notes add first program, for the analytical engine
              notes ls
              notes signup grace@example.com hopper-1906
              notes ls
            expect: |
              #1 added
              ada@example.com: 1 note(s)
              grace@example.com: 0 note(s)
    steps:
      - uses: actions/checkout@v7

      # Installs Go from mise.toml (cached between runs)
      - uses: jdx/mise-action@v5

      - name: Use a Docker Hub mirror
        run: |
          config=/etc/docker/daemon.json
          [ -s "$config" ] || echo '{}' | sudo tee "$config" > /dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' "$config" | sudo tee "$config.new" > /dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker

      - uses: actions/download-artifact@v8
        with:
          name: tools-image

      - name: Build the ${{ matrix.example }} example
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          zstd -dc tools.tar.zst | docker load && rm tools.tar.zst
          go build -o snowglobe ./cmd/snowglobe
          ./snowglobe build "examples/$EXAMPLE" --out "dist/$EXAMPLE"

      - name: Run it
        env:
          EXAMPLE: ${{ matrix.example }}
          COMMANDS: ${{ matrix.commands }}
          EXPECT: ${{ matrix.expect }}
        run: |
          printf '%s' "$COMMANDS" | ./snowglobe run "dist/$EXAMPLE" | tee out.txt
          printf '%s' "$EXPECT" | while IFS= read -r line; do
            [ -z "$line" ] && continue
            grep -qF -- "$line" out.txt || { echo "::error title=$EXAMPLE::expected a line with: $line"; exit 1; }
          done
