name: Smoke test

# One small site, built and driven end to end the way people use it: snowglobe build, then
# snowglobe run (piped and detached), exec, attach, -p port forwarding, and HTTP(S) out of the
# guest. arm64 runners build the arm64 guest natively.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Installs Go from mise.toml (cached between runs)
      - uses: jdx/mise-action@v5

      - name: Use a Docker Hub mirror
        run: |
          config=/etc/docker/daemon.json
          [ -s "$config" ] || echo '{}' | sudo tee "$config" > /dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' "$config" | sudo tee "$config.new" > /dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker

      - name: Build the curl example
        run: |
          go build -o snowglobe ./cmd/snowglobe
          ./snowglobe build examples/curl --out dist/curl

      - name: Run it piped
        run: |
          out=$(printf 'uname -m\n' | ./snowglobe run dist/curl)
          echo "$out"
          [ "$out" = aarch64 ]

      - name: Detached, exec, HTTP(S) out of the guest
        run: |
          ./snowglobe run dist/curl --name smoke --detach -p 18000:8000
          # Each check says what it got (annotations are readable without the log)
          expect() {
            if [ "$(cat "$1")" != "$2" ]; then
              echo "::error title=$3::expected '$2', got '$(head -c 600 "$1" | tr '\n\r%' ';;_')'"
              return 1
            fi
          }
          status=0
          ./snowglobe exec smoke 'nproc' | tee nproc.txt
          expect nproc.txt 1 nproc || status=1
          ./snowglobe exec smoke 'curl -sS -o /dev/null -w "%{http_code}" https://api.github.com/zen' | tee https.txt
          expect https.txt 200 "HTTPS out of the guest" || status=1
          ./snowglobe exec smoke 'curl -sS -o /dev/null -w "%{http_code}" http://example.com/' | tee http.txt
          expect http.txt 200 "HTTP out of the guest" || status=1
          ./snowglobe exec smoke 'time curl -sv -m 40 -o /dev/null -w "code=%{http_code}\n" http://example.com/ 2>&1; echo diag-done' > diag.txt 2>&1 || true
          echo "::error title=diag1::$(tail -c 900 diag.txt | tr '\n\r%' ';;_')"
          ./snowglobe exec smoke 'curl -s -m 40 -o /dev/null -w "code=%{http_code}\n" http://example.com/; echo diag-done' > diag2.txt 2>&1 || true
          echo "::error title=diag2::$(tail -c 300 diag2.txt | tr '\n\r%' ';;_')"
          ./snowglobe exec smoke 'curl -s -m 40 -o /dev/null -w "code=%{http_code}\n" https://example.com/; echo diag-done' > diag3.txt 2>&1 || true
          echo "::error title=diag3::$(tail -c 300 diag3.txt | tr '\n\r%' ';;_')"
          docker ps -a --format '{{.Names}} {{.Image}}' ; for c in $(docker ps -q); do docker logs --tail 30 "$c" 2>&1 | tail -30 > dl.txt; echo "::error title=logs::$(tr '\n\r%' ';;_' < dl.txt | tail -c 900)"; done
          exit $status

      - name: Port forwarding into the guest
        run: |
          ./snowglobe exec smoke '(while true; do printf "HTTP/1.0 200 OK\r\n\r\nhello from the guest\n" | nc -l -p 8000; done) >/dev/null 2>&1 &'
          for i in 1 2 3 4 5; do
            body=$(curl -sS -m 20 http://127.0.0.1:18000/ || true)
            [ "$body" = "hello from the guest" ] && break
            sleep 2
          done
          echo "$body"
          [ "$body" = "hello from the guest" ]

      - name: Attach and detach
        run: |
          out=$( (sleep 2; printf 'echo attached-$((40+2))\n'; sleep 3; printf '\035') | ./snowglobe attach smoke)
          echo "$out"
          echo "$out" | grep -q attached-42
          ./snowglobe ps | grep -q smoke

      - name: Clean up
        if: always()
        run: ./snowglobe stop smoke || true
