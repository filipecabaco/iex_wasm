[tools]
go = "1.27.1"

[tasks.build]
description = "Build the IEx example into dist/ with snowglobe"
run = "go run ./cmd/snowglobe build examples/iex --out dist"

[tasks.serve]
description = "Serve dist/ locally at http://localhost:8000"
run = "go run ./cmd/snowglobe serve dist"

[tasks.test]
description = "Run the tests"
run = "go test ./..."
